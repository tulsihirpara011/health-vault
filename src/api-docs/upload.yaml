paths:
  /documents/upload:
    post:
      summary: Upload file to AWS S3
      tags:
        - File Upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        200:
          description: File uploaded successfully

        400:
          description: Bad request
        500:
          description: Server error
  /download-url:
    get:
      summary: Get download URL from S3
      tags:
        - File Download
      parameters:
        - in: query
          name: filekey
          required: true
          schema:
            type: string
          description: S3 file key
      responses:
        200:
          description: URL generated successfully

        400:
          description: File key missing
        500:
          description: Server error
